# ProteinHouse — Nginx config (PRODUCTION — requires domain + SSL)
# Use this AFTER the domain is pointed to EC2 and Let's Encrypt cert is issued.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/conf.d/proteinhouse.conf
#   sudo certbot --nginx -d proteinhouse.ba -d www.proteinhouse.ba
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before domain is ready → use nginx-temp.conf instead.

upstream proteinhouse_app {
    # PM2 cluster — Node.js SSR server
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name proteinhouse.ba www.proteinhouse.ba;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (SSL via Let's Encrypt / Certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proteinhouse.ba www.proteinhouse.ba;

    # SSL certs (run: sudo certbot --nginx -d proteinhouse.ba -d www.proteinhouse.ba)
    ssl_certificate     /etc/letsencrypt/live/proteinhouse.ba/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proteinhouse.ba/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # Static assets — long cache (Vite adds content hash to filenames)
    location /assets/ {
        alias /home/ec2-user/proteinhouse/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon & public files
    location ~* \.(ico|svg|png|jpg|webp|woff2|woff)$ {
        root /home/ec2-user/proteinhouse/dist/client;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # All other requests → Node.js SSR
    location / {
        proxy_pass         http://proteinhouse_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
