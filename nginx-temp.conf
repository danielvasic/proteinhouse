# ProteinHouse — Nginx config (TEMPORARY — HTTP only, no domain required)
# Use this while waiting for a domain.
#
# Install:
#   sudo cp nginx-temp.conf /etc/nginx/conf.d/proteinhouse.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Access app at:  http://<YOUR-EC2-PUBLIC-IP>
#
# When domain is ready → switch to nginx.conf (has HTTPS + Let's Encrypt)

upstream proteinhouse_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;          # Accept any hostname or bare IP

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # Static assets — long cache (Vite adds content hash to filenames)
    location /assets/ {
        alias /home/ec2-user/proteinhouse/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon & public files
    location ~* \.(ico|svg|png|jpg|webp|woff2|woff)$ {
        root /home/ec2-user/proteinhouse/dist/client;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # All other requests → Node.js SSR
    location / {
        proxy_pass         http://proteinhouse_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
