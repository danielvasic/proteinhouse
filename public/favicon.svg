<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy circle -->
  <circle cx="16" cy="16" r="15" fill="#0F2952"/>
  <!-- Outer white ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Inner white ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="white" stroke-width="0.6" stroke-opacity="0.75"/>
  <!-- PH — properly centered -->
  <text
    x="16"
    y="16"
    font-family="Oswald, Impact, sans-serif"
    font-size="15"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-0.5"
    fill="white"
  >PH</text>
</svg>
