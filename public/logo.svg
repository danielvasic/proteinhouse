<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="ProteinHouse">
  <!-- Navy fill -->
  <circle cx="150" cy="150" r="138" fill="#0F2952"/>
  <!-- Outer white ring -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="white" stroke-width="7"/>
  <!-- Inner white ring (inside navy, near edge) -->
  <circle cx="150" cy="150" r="125" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- PH — stretched to match PROTEIN HOUSE width (176px = divider line width) -->
  <text
    x="150"
    y="174"
    font-family="Oswald, 'Arial Narrow', Impact, sans-serif"
    font-size="110"
    font-weight="700"
    text-anchor="middle"
    fill="white"
    textLength="176"
    lengthAdjust="spacing"
  >PH</text>

  <!-- Thin divider line — 176px wide, centered -->
  <line x1="62" y1="190" x2="238" y2="190" stroke="white" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- PROTEIN HOUSE — same 176px width as PH above -->
  <text
    x="150"
    y="213"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-size="14.5"
    text-anchor="middle"
    fill="white"
    textLength="176"
    lengthAdjust="spacing"
  ><tspan font-weight="700">PROTEIN</tspan><tspan font-weight="300"> HOUSE</tspan></text>
</svg>
