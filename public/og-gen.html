<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG generator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#333;font-family:Inter,system-ui,sans-serif}
  canvas{width:600px;display:block;margin:20px auto;outline:1px solid #666}
  .bar{max-width:600px;margin:0 auto 20px;color:#bbb;font-size:13px;text-align:center}
  .bar a{color:#7fb0ff}
  body.flat{background:transparent}
  body.flat canvas{width:1200px;margin:0;outline:none}
  body.flat .bar{display:none}
</style>
<script>if (location.search.includes('flat')) document.addEventListener('DOMContentLoaded', () => document.body.classList.add('flat'))</script>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="bar">Desni klik na sliku → <em>Save image as…</em> → <code>public/og-image.png</code></div>
<script>
/**
 * Generiše og-image.png (WhatsApp / Facebook / Twitter preview).
 *
 * Kompozicija prati naslovnicu brand booka 2026: bijela podloga, dijagonalne
 * ploče u Night Blacku, zvanični logo i kosi uppercase naslov u Electric Blueu,
 * te Vulcan Orange traka kao energični akcent.
 *
 * Logo se crta iz /brand/logo-full.svg (slova u krivuljama) pa ne zavisi od
 * webfonta. Naslov koristi Inter Italic — mora se učitati eksplicitno, inače
 * canvas padne na serif oblique.
 */
const BLUE = '#0145f2', ORANGE = '#ff4103', NIGHT = '#1e272e', CLOUD = '#edf1f5'

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image()
    img.onload = () => res(img); img.onerror = rej; img.src = src
  })
}

/** Dijagonalna ploča (paralelogram nagnut 45°) — motiv s naslovnice */
function slab(x, cx, cy, len, thick, color, alpha = 1) {
  x.save()
  x.globalAlpha = alpha
  x.fillStyle = color
  x.translate(cx, cy)
  x.rotate(-Math.PI / 4)
  x.fillRect(-len / 2, -thick / 2, len, thick)
  x.restore()
}

async function draw() {
  await document.fonts.load('italic 800 64px "Inter"')
  await document.fonts.load('italic 700 26px "Inter"')
  await document.fonts.load('400 24px "Inter"')
  await document.fonts.ready
  const logo = await loadImg('/brand/logo-full.svg')
  const x = document.getElementById('c').getContext('2d')

  // ── Podloga ──
  x.fillStyle = '#ffffff'
  x.fillRect(0, 0, 1200, 630)

  // ── Dijagonalne ploče: gore lijevo tamne, dolje desno plave ──
  x.save()
  x.beginPath(); x.rect(0, 0, 1200, 630); x.clip()

  slab(x, 120,  40,  520, 74, NIGHT)
  slab(x, 250, -30,  420, 52, NIGHT)
  slab(x,  40, 190,  360, 40, NIGHT, 0.85)
  slab(x, 330, 120,  200, 28, CLOUD)

  slab(x, 1090, 600, 520, 74, NIGHT)
  slab(x,  960, 660, 420, 52, NIGHT)
  slab(x, 1170, 430, 360, 40, NIGHT, 0.85)
  slab(x,  880, 520, 200, 28, CLOUD)

  slab(x, 1080, 120, 260, 30, BLUE, 0.9)
  slab(x,  150, 520, 260, 30, BLUE, 0.9)
  x.restore()

  // ── Logo, centriran ──
  const lw = 420, lh = Math.round(lw * 115 / 300)
  x.drawImage(logo, (1200 - lw) / 2, 138, lw, lh)

  // ── Naslov ──
  x.textAlign = 'center'
  x.fillStyle = BLUE
  x.font = 'italic 800 62px "Inter"'
  x.fillText('SUPLEMENTI', 600, 400)
  x.fillText('ZA POBJEDNIKE', 600, 466)

  // ── Vulcan Orange traka na dnu ──
  x.fillStyle = ORANGE
  x.fillRect(0, 552, 1200, 78)
  x.fillStyle = '#ffffff'
  x.font = 'italic 700 26px "Inter"'
  x.fillText('ORIGINALNI PROIZVODI  ·  BRZA DOSTAVA PO BIH  ·  PROTEINHOUSE.BA', 600, 601)

  window.__og = document.getElementById('c').toDataURL('image/png')
  window.__ogReady = true
}
draw()
</script>
</body>
</html>
