# Netlify build + deploy config for ProteinHouse SSR
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # build:netlify = vite build (client + server) then generate the Lambda function
  command = "npm run build:netlify"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # esbuild bundles the function + all imports into a single file — no runtime path issues
  node_bundler = "esbuild"

# API funkcije (npr. AI generator opisa) — mora ici PRIJE catch-all SSR pravila ispod,
# jer Netlify uzima prvo pravilo koje se poklopi.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Feed proizvoda za Google Merchant Center i Meta katalog. Zaseban unos jer
# obje platforme traze URL s .xml nastavkom, a /api/* pravilo iznad bi
# proslijedilo "feed.xml" kao ime funkcije i promasilo.
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

# Naslovnica MORA imati force. dist/client/index.html postoji kao prava
# datoteka, a Netlify staticke datoteke servira PRIJE nego pogleda redirecte
# (osim uz force) — pa je "/" dobijala goli sablon s nezamijenjenim
# <!--app-head--> i <!--app-html-->: bez SSR sadrzaja, bez __PH_MJERENJE__
# (GTM se nikad nije ucitao posjetiocima koji udju preko naslovnice, a to je
# vecina) i bez google-site-verification meta taga na korijenu, gdje ga
# Search Console trazi. Ostale rute nemaju istoimenu datoteku pa rewrite
# ispod radi i bez force. Force ide SAMO ovdje: na "/*" bi pregazio i
# /assets/ i sve iz public/.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true

# Static assets in dist/client are served directly by Netlify CDN (fast, cached, no function hit).
# Every other URL is an SSR rewrite — the browser URL stays the same (status 200).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
